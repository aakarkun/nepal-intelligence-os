# Nepal Intelligence OS — run API + Worker + Postgres with Docker.
# From repo root: docker compose up --build
#
# Env: Compose reads root .env for substitution (optional; copy from .env.example).
# DATABASE_URL and API_URL are set below for the Docker network. See docs/DOCKER.md.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nepal_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nepal_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nepal_intel
      API_PORT: 3001
      WORKER_SECRET: ${WORKER_SECRET:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      API_URL: http://api:3001
      WORKER_SECRET: ${WORKER_SECRET:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      MODE: live
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
